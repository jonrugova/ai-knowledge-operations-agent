services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_demo}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_demo_local_only}
    volumes:
      - knowledge_demo_db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-knowledge_demo} -d ${POSTGRES_DB:-knowledge_demo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge_demo}:${POSTGRES_PASSWORD:-knowledge_demo_local_only}@db:5432/${POSTGRES_DB:-knowledge_demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the runtime environment}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the runtime environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the runtime environment}
      EMPLOYEE_PASSWORD: ${EMPLOYEE_PASSWORD:?Set EMPLOYEE_PASSWORD in the runtime environment}
    ports:
      - "8000:8000"

volumes:
  knowledge_demo_db: